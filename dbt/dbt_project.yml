# The governed dbt project behind the SharpSight BI datasets.
#
# TWO targets, two database roles, two schemas (profiles/profiles.yml):
#   prod  →  schema `bi`,      built by the dbt-runner, never by the AI service
#   dev   →  schema `bi_dev`,  where the AI builds what it generates, on a branch of its own
# The AI's role can read `bi` and create only in `bi_dev`: PostgreSQL refuses anything else, whatever a
# generated model says.
name: sharpsight_bi
version: "1.0.0"
config-version: 2
profile: sharpsight_bi

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
macro-paths: [macros]
target-path: target
clean-targets: [target, dbt_packages]

# dbt reports anonymous usage to its vendor by default. This kit runs air-gapped and announces itself to nobody.
flags:
  send_anonymous_usage_stats: false
  # a generic test's inputs are written under `arguments:`, the shape dbt is moving to
  require_generic_test_arguments_property: true

vars:
  # where the CEM extract is landed. In this kit it is synthetic (services/ai-bi/sql/bootstrap.sql); with a
  # real cluster it is what cem_to_mart.py writes, and only this variable changes.
  cem_source_schema: cem_landing

models:
  sharpsight_bi:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      # Generated models are TABLES, never views: a view in bi_dev over a table in bi is dropped by the
      # next production build (dbt swaps tables with a cascading drop).
      ai_generated:
        +materialized: table
        +tags: [ai_generated]

seeds:
  sharpsight_bi:
    dim_region:
      +column_types:
        region: text
        region_iso: text

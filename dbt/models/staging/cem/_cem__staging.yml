version: 2

models:
  - name: stg_cem__site_kpi_daily
    description: The landed CEM extract, renamed and typed.
    columns:
      - name: date
        data_tests: [not_null]
      - name: site_id
        data_tests: [not_null]
      - name: region
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_region')
              field: region
      - name: rat
        data_tests:
          - not_null
          - accepted_values:
              values: ["2G", "3G", "4G", "5G"]

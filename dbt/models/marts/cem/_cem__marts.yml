version: 2

models:
  - name: mart_cem_qoe_daily
    description: Quality of experience per day, region and radio access technology. Certified (dataset cem.qoe_daily).
    meta:
      sharpsight_dataset: cem.qoe_daily
      owner: CEM
      certified: true
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [date, region, rat]
    columns:
      - name: date
        description: The day the KPIs were measured.
        data_tests: [not_null]
      - name: region
        description: Administrative region, as named by the bundled map.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region
      - name: rat
        description: Radio access technology.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["2G", "3G", "4G", "5G"]
      - name: qoe_score
        description: Quality of experience on a 1 to 5 scale, weighted by active users.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: active_users
        description: Subscribers with at least one session that day.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: degraded_users
        description: Active users whose experience fell under the acceptable threshold.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: loaded_at
        description: When this row was built.

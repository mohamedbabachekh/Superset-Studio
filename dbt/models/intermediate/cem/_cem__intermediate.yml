version: 2

models:
  - name: int_cem__qoe_site_daily
    description: Quality of experience per day, site and radio access technology.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [date, site_id, rat]
    columns:
      - name: qoe_score
        description: Quality of experience on a 1 to 5 scale.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: active_users
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0

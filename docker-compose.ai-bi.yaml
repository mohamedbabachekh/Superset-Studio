# SharpSight AI BI — an OVERLAY on the dev kit. It adds the engine to the kit's own compose project; it does not
# change one line of docker-compose.yaml, and the kit starts without it exactly as before. With it, the kit's
# Superset is started with a configuration layer over its own and two more mounts (the last service below):
# Superset is the engine's interface, so what the engine shows a person is added to Superset itself.
#
#   bash ai-bi.sh            start the kit AND the engine (writes the engine's secrets into .env on first use)
#   bash ai-bi.sh demo       the brief's request, end to end
#   bash ai-bi.sh --stop     stop the engine's containers, leave the kit running
#
# or by hand:  docker compose -p sharpsight-superset-devkit -f docker-compose.yaml -f docker-compose.ai-bi.yaml up -d
#
# What starts, in order:
#   aibi-db-init         one-shot · four database roles, four schemas, the landed CEM extract (synthetic)
#   dbt-runner           one-shot · builds the governed dbt project into `bi`, publishes dbt's artifacts
#   aibi-superset-init   one-shot · the engine's own Superset account
#   sharpsight-ai-bi     the service, on 127.0.0.1:${AIBI_PORT:-3003}
#
# WHO HOLDS WHICH PASSWORD — the point of having four containers rather than one:
#   the database owner's   aibi-db-init only, for the seconds it runs
#   bi_builder's           dbt-runner only (production build)
#   aibi_dbt_dev's         the service: may create in `bi_dev`, nowhere else
#   bi_reader's            the service, and Superset's BI connection: reads, never writes
#   bi_records_reader's    the service, for Superset's second connection: reads the copy of the engine's own
#                          records (bi_factory) and nothing else; SQL Lab is closed on it
# The service that talks to a model holds no credential that can change a governed table.
#
# These secrets are generated by ai-bi.sh as plain hexadecimal. Keep them so: compose interpolates `$` in .env
# values (docs/lessons.md), and a hand-written password with one in it would arrive cut.

name: sharpsight-superset-devkit

x-warehouse: &warehouse
  DBT_HOST: devkit-db
  DBT_PORT: "5432"
  DBT_DBNAME: devkit

services:
  aibi-db-init:
    image: postgres:16.4
    environment:
      PGPASSWORD: "${DEVKIT_DB_PASSWORD:?set DEVKIT_DB_PASSWORD in .env}"
      BUILDER_PW: "${AIBI_BUILDER_PASSWORD:?run ai-bi.sh once: it writes the engine's secrets into .env}"
      DEV_PW: "${AIBI_DBT_DEV_PASSWORD:?run ai-bi.sh once: it writes the engine's secrets into .env}"
      READER_PW: "${AIBI_READER_PASSWORD:?run ai-bi.sh once: it writes the engine's secrets into .env}"
      RECORDS_PW: "${AIBI_RECORDS_READER_PASSWORD:?run ai-bi.sh once: it writes the engine's secrets into .env}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h devkit-db -U devkit -d devkit -q -t \
             -v builder_pw="$$BUILDER_PW" -v dev_pw="$$DEV_PW" -v reader_pw="$$READER_PW" \
             -v records_pw="$$RECORDS_PW" \
             -f /sql/bootstrap.sql
    volumes:
      - ./services/ai-bi/sql:/sql:ro
    depends_on:
      devkit-db:
        condition: service_healthy
    restart: "no"

  # What Airflow triggers in the target architecture. Here: once, at every start.
  dbt-runner:
    build:
      context: ./services/ai-bi
    image: sharpsight-ai-bi:0.1.0
    command: ["python", "-m", "aibi.dbt_build"]
    environment:
      <<: *warehouse
      DBT_TARGET: prod
      DBT_USER: bi_builder
      DBT_PASSWORD: "${AIBI_BUILDER_PASSWORD}"
      DBT_SCHEMA: bi
    volumes:
      - ./dbt:/app/dbt:ro
      - aibi-dbt-prod:/var/lib/dbt-prod
      - aibi-dbt-docs:/var/lib/dbt-docs
    depends_on:
      aibi-db-init:
        condition: service_completed_successfully
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  # The engine signs in to Superset as itself, never as the kit's admin: what it creates is attributed to it in
  # Superset's own logs. Admin, because it must create the BI connection — in this DEV Superset. The account is
  # created with Superset's own CLI, the supported way, and its password follows .env on every start.
  aibi-superset-init:
    image: sharpsight-superset-devkit:1.0.0
    environment:
      SUPERSET_SECRET_KEY: "${DEVKIT_SECRET_KEY}"
      SUPERSET_META_URI: "postgresql+psycopg2://devkit:${DEVKIT_DB_PASSWORD}@devkit-db:5432/superset"
      SUPERSET_REDIS_URL: "redis://devkit-redis:6379/0"
      PYTHONPATH: "/app/pythonpath"
      AIBI_SUPERSET_USER: "${AIBI_SUPERSET_USER:-sharpsight-ai}"
      AIBI_SUPERSET_PASSWORD: "${AIBI_SUPERSET_PASSWORD:?run ai-bi.sh once: it writes the engine's secrets into .env}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        superset fab create-user --username "$$AIBI_SUPERSET_USER" --firstname SharpSight --lastname "AI BI" \
          --email ai-bi@sharpsight.local --role Admin --password "$$AIBI_SUPERSET_PASSWORD" >/dev/null 2>&1 || true
        superset fab reset-password --username "$$AIBI_SUPERSET_USER" --password "$$AIBI_SUPERSET_PASSWORD" >/dev/null 2>&1
        echo "Superset account $$AIBI_SUPERSET_USER is ready"
    depends_on:
      devkit-init:
        condition: service_completed_successfully
    restart: "no"

  sharpsight-ai-bi:
    build:
      context: ./services/ai-bi
    image: sharpsight-ai-bi:0.1.0
    environment:
      AIBI_WAREHOUSE_HOST: devkit-db
      AIBI_WAREHOUSE_DB: devkit
      AIBI_READER_USER: bi_reader
      AIBI_READER_PASSWORD: "${AIBI_READER_PASSWORD}"
      AIBI_RECORDS_READER_USER: bi_records_reader
      AIBI_RECORDS_READER_PASSWORD: "${AIBI_RECORDS_READER_PASSWORD}"
      AIBI_DBT_DEV_USER: aibi_dbt_dev
      AIBI_DBT_DEV_PASSWORD: "${AIBI_DBT_DEV_PASSWORD}"
      AIBI_DBT_DEV_SCHEMA: bi_dev
      AIBI_SUPERSET_URL: "http://superset-devkit:8088"
      AIBI_SUPERSET_PUBLIC_URL: "http://${DEVKIT_BIND:-127.0.0.1}:${DEVKIT_PORT:-3002}"
      AIBI_SUPERSET_USER: "${AIBI_SUPERSET_USER:-sharpsight-ai}"
      AIBI_SUPERSET_PASSWORD: "${AIBI_SUPERSET_PASSWORD}"
      AIBI_API_TOKEN: "${AIBI_API_TOKEN:?run ai-bi.sh once: it writes the engine's secrets into .env}"
      # Which model drives the planner is an open decision. `none` is the deterministic planner (aibi/llm.py).
      AIBI_LLM_PROVIDER: "${AIBI_LLM_PROVIDER:-none}"
    ports:
      # Loopback, and not negotiable the way the kit's own port is: the API trusts the user named in a header
      # because the caller holds the gateway's token. It is the portal's backend, not something to browse to.
      - "127.0.0.1:${AIBI_PORT:-3003}:8080"
    volumes:
      # the governed registries and the governed dbt project: read-only. The service cannot edit either.
      - ./registry:/app/registry:ro
      - ./dbt:/app/dbt:ro
      - aibi-dbt-prod:/var/lib/dbt-prod:ro
      # its own state: the two git repositories, the AI's dbt workspaces, the audit log, the packages
      - aibi-state:/var/lib/ai-bi
      # a .ssbi package lands beside the dashboards you export by hand
      - ./exports:/app/exports
    depends_on:
      dbt-runner:
        condition: service_completed_successfully
      aibi-superset-init:
        condition: service_completed_successfully
      superset-devkit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    init: true
    restart: unless-stopped
    deploy:
      resources:
        # the browser is the appetite here: about 480 MiB at the peak of a seven-chart dashboard (measured),
        # 77 MiB idle. The limit leaves room for a template twice that size.
        limits: { cpus: "2.0", memory: 1280m }

  # WHAT SHARPSIGHT ADDS TO SUPERSET ITSELF. Superset is the interface: the engine has no page of its own. This
  # extends the kit's Superset service — compose merges it with the one in docker-compose.yaml — with a
  # configuration layer over the kit's own (superset-addon/), and dbt's documentation to serve, read-only.
  superset-devkit:
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config_ai_bi.py
      SHARPSIGHT_DBT_DOCS_DIR: /app/sharpsight/dbt-docs
    volumes:
      - ./superset-addon/superset_config_ai_bi.py:/app/pythonpath/superset_config_ai_bi.py:ro
      - ./superset-addon/sharpsight_bi.py:/app/pythonpath/sharpsight_bi.py:ro
      - aibi-dbt-docs:/app/sharpsight/dbt-docs:ro

volumes:
  aibi-state:
  aibi-dbt-prod:
  aibi-dbt-docs:      # dbt's documentation site, written by dbt-runner, read by Superset. Rewritten at every build.

# Who may do what, and read what. A STAND-IN for the SharpSight portal's own RBAC: in the target
# architecture the identity arrives from Keycloak through the gateway, and these grants live in the platform.
# The file keeps the same shape so the policy engine does not change when the source does.
tenants: [default]

roles:
  bi_developer:
    capabilities: [bi.read, bi.generate, tools.use]
    datasets: ["cem.*"]
    classifications: [public, internal]
  bi_reviewer:
    capabilities: [bi.read, bi.approve_uat, bi.reject]
    datasets: ["cem.*"]
    classifications: [public, internal]
  bi_release_manager:
    # tools.use: a restore re-applies a specification through the same tools a generation uses
    capabilities: [bi.read, bi.approve_uat, bi.approve_prod, bi.reject, bi.restore, tools.use]
    datasets: ["cem.*"]
    classifications: [public, internal]
  # The people a CEM dashboard is FOR. They open it in the BI engine; they generate and approve nothing.
  cem_analyst:
    capabilities: [bi.read]
    datasets: ["cem.*"]
    classifications: [public, internal]
  # The same, for one part of the country — see row_filters below.
  cem_regional_analyst:
    capabilities: [bi.read]
    datasets: ["cem.*"]
    classifications: [public, internal]
  auditor:
    capabilities: [bi.read, audit.read]
    datasets: []
    classifications: []
  viewer:
    capabilities: [bi.read]
    datasets: []
    classifications: [public]

users:
  dev.user:
    type: human
    tenant: default
    roles: [bi_developer]
  lead.reviewer:
    type: human
    tenant: default
    roles: [bi_reviewer, auditor]
  release.manager:
    type: human
    tenant: default
    roles: [bi_release_manager, auditor]
  cem.analyst:
    type: human
    tenant: default
    roles: [cem_analyst]
  east.analyst:
    type: human
    tenant: default
    roles: [cem_regional_analyst]
  guest.user:
    type: human
    tenant: default
    roles: [viewer]
  # The engine's own identity. It can never approve anything: approval capabilities are refused to a
  # non-human whatever its roles say.
  sharpsight-ai:
    type: ai
    tenant: default
    roles: [bi_developer]

# Row-level policies, per role and dataset: a SQL predicate over that dataset's columns.
#
# ONE declaration, enforced in two places that must agree: the data gateway rewrites every reference to the
# dataset into a filtered subquery, and the BI engine is given the same predicate as a row-level rule for the
# role (aibi/tools.py, apply_superset_access). A policy on a dataset follows it into every dataset DERIVED
# from it — the generated map dataset inherits the mart's.
#
# A role without a policy does not lift another role's: someone holding both sees the restricted rows.
row_filters:
  cem_regional_analyst:
    cem.qoe_daily: "region in ('Oriental', 'Fès - Boulemane', 'Taza - Al Hoceima - Taounate')"

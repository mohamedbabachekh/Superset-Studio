# SharpSight design tokens. A template chooses FROM this file; nothing else reaches a dashboard's stylesheet.
#
# The AI never writes CSS. It names a token (`accent: primary`), the generator turns the token into a rule
# scoped to that one dashboard, and a name that is not here is refused before Superset is called.
colors:
  primary: "#0972BC"        # SharpSight blue — the same value superset/superset_config.py gives the interface
  info: "#26ABA8"
  success: "#37A15E"
  warning: "#F2B72D"
  error: "#D64545"
  text: "#1F2430"
  text_muted: "#5B6472"
  border: "#E3E6EC"
  surface: "#FFFFFF"
  surface_muted: "#F5F6F9"

# Categorical schemes. Each must also be registered in superset/superset_config.py (EXTRA_CATEGORICAL_COLOR_SCHEMES)
# or ship with Superset — a scheme Superset does not know falls back to its default without a word.
color_schemes: [sharpsight, inwi, supersetColors]

# Whose colours a dashboard wears. SharpSight's own lead (decided 2026-10-04); a client's are a variant, named
# in the request (« … in inwi's colours ») or in a specification (`theme.brand`). A brand is an accent — where a
# template says `accent: primary` — and the series its charts are drawn in. Nothing else changes: the page
# around the dashboard is Superset's, and stays SharpSight's.
brands:
  sharpsight: {accent: "#0972BC", color_scheme: sharpsight}
  inwi: {accent: "#E6007E", color_scheme: inwi}
default_brand: sharpsight

# Sequential schemes, for maps and heat. All four are in the 6.1 frontend bundle (read from the image).
sequential_schemes: [superset_seq_1, superset_seq_2, blue_white_yellow, schemeBlues]

typography:
  display: {size_px: 40, weight: 700}
  heading_l: {size_px: 24, weight: 700}
  heading_m: {size_px: 20, weight: 600}
  heading_s: {size_px: 14, weight: 600}
  body: {size_px: 13, weight: 400}

spacing:
  xs: 4
  sm: 8
  md: 16
  lg: 24

radius:
  card: 10

component_variants:
  kpi_card: [plain, accent_top]
  chart_card: [plain, bordered]

theme_variants: [light]

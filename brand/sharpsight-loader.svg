<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 159" width="98" height="159">
  <!-- SharpSight loader « Cascade » (Brand kit / SharpSight Loader): the mark's five facets light top to bottom, one loop
       in 1.9 s with the kit's stagger — its default for page loads, route changes and dashboard fetches. The animation is
       the SVG's own CSS, so Superset's <img> spinner moves without a frontend build. Reduced motion holds the static mark. -->
  <style>
    @keyframes ss-cascade { 0%, 70%, 100% { opacity: .14 } 12%, 28% { opacity: 1 } }
    path { animation: ss-cascade 1.9s linear infinite }
    .facet-2 { animation-delay: .1s }
    .facet-3 { animation-delay: .2s }
    .facet-4 { animation-delay: .3s }
    @media (prefers-reduced-motion: reduce) { path { animation: none; opacity: 1 } }
  </style>
  <path fill="#F2B72D" d="M45.1 3.12Q49 0,52.9 3.12L90.1 32.88Q94 36,90.05 39.07L52.95 67.93Q49 71,45.05 67.93L7.95 39.07Q4 36,7.9 32.88Z"/>
  <path class="facet-2" fill="#26ABA8" d="M0 44.6Q0 42,2.05 43.6L42.95 75.4Q45 77,43.58 79.18L20.42 114.82Q19 117,17.7 114.75L1.3 86.25Q0 84,0 81.4Z"/>
  <path class="facet-2" fill="#F8644E" d="M95.95 43.6Q98 42,98 44.6L98 81.4Q98 84,96.7 86.25L80.3 114.75Q79 117,77.58 114.82L54.42 79.18Q53 77,55.05 75.4Z"/>
  <path class="facet-3" fill="#37A15E" d="M47.61 82.2Q49 80,50.39 82.2L73.61 118.8Q75 121,74 123.4L71 130.6Q70 133,67.4 133L30.6 133Q28 133,27 130.6L24 123.4Q23 121,24.39 118.8Z"/>
  <path class="facet-4" fill="#0972BC" d="M28 141Q28 138,31 138L67 138Q70 138,70 141L70 146Q70 149,67.88 151.12L62.12 156.88Q60 159,57 159L41 159Q38 159,35.88 156.88L30.12 151.12Q28 149,28 146Z"/>
</svg>
